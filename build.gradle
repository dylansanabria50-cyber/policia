plugins {
id 'eclipse'
id 'idea'
id 'maven-publish'
id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.example.policia'
base { archivesName = 'policia' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
mappings channel: 'official', version: '1.20.1'
runs {
configureEach {
workingDirectory project.file('run')
property 'forge.logging.markers', 'REGISTRIES'
property 'forge.logging.console.level', 'debug'
mods { "policia" { source sourceSets.main } }
}
client { property 'forge.enabledGameTestNamespaces', 'policia' }
server { property 'forge.enabledGameTestNamespaces', 'policia'; args '--nogui' }
}
}

// ===== Proyecto "plano": todos los .java del mod estan en la raiz, sin carpetas =====
def flatResDir = new File(layout.buildDirectory.get().asFile, 'flat-resources')

sourceSets {
main {
java {
srcDirs = [projectDir]
include '*.java'
}
resources {
srcDirs = [flatResDir]
}
}
}

repositories {
maven {
name = "GeckoLib"
url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
content { includeGroup "software.bernie.geckolib" }
}
}

dependencies {
// 47.3.x+ para tener disponible RenderArmorEvent (ocultar armadura). Si tu
// instalacion usa otro build de Forge 1.20.1, podes bajarlo, pero entonces
// el boton de ocultar armadura puede no compilar (ver PoliciaClient.armorPre).
minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
// Libreria de animaciones usada por el prop del yunque/martillo del
// Herrero Legendario (vease PoliciaForja). Si esta version ya no existe,
// cambiala por la ultima "4.4.x-forge-1.20.1" en
// https://modrinth.com/mod/geckolib/versions
implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.4')
}

tasks.named('jar', Jar).configure {
manifest.attributes([
'Specification-Title': 'policia',
'Specification-Vendor': 'policia',
'Specification-Version': '1',
'Implementation-Title': project.name,
'Implementation-Version': project.jar.archiveVersion,
'Implementation-Vendor': 'policia'
])
finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('stageResources', Sync) {
into flatResDir
from(projectDir) { include 'mods.toml'; into 'META-INF' }
from(projectDir) { include 'pack.mcmeta' }
from(projectDir) { include 'assets/**' }
from(projectDir) { include 'data/**' }
}

tasks.named('processResources').configure { dependsOn 'stageResources' }
