name: Build mod

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        id: compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --console=plain 2>&1 | tee build.log

      # Log publico de la ultima compilacion (sirve para revisar errores
      # sin tener que iniciar sesion en GitHub).
      - name: Publicar log
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "commit: ${GITHUB_SHA}" > build-log.txt
          echo "resultado: ${{ steps.compilar.outcome }}" >> build-log.txt
          echo "----" >> build-log.txt
          cat build.log >> build-log.txt 2>/dev/null || true
          for i in 1 2 3 4 5; do
            gh release view ultima-log >/dev/null 2>&1 || gh release create ultima-log --title "Log de la ultima compilacion" --notes "Se actualiza en cada push." --prerelease --target "${GITHUB_SHA}" || true
            gh release upload ultima-log build-log.txt --clobber && break
            sleep 5
          done

      - name: Publicar jar
        if: steps.compilar.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          sleep 3
          gh release create ultima build/libs/policia-1.0.0.jar \
            --title "Ultima version compilada" \
            --notes "Compilado automaticamente desde ${GITHUB_SHA}. Descarga policia-1.0.0.jar y ponelo en la carpeta mods (Forge 1.20.1)." \
            --target "${GITHUB_SHA}" --latest

      - uses: actions/upload-artifact@v4
        if: steps.compilar.outcome == 'success'
        with:
          name: policia-jar
          path: build/libs/policia-1.0.0.jar
